# docker-compose.yml
version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: finresearch-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: finresearch-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: finresearch-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - api
    restart: unless-stopped
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  qdrant_data: